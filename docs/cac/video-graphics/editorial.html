<style>
@font-face{font-family:J;src:url(file:///Users/vintibangkochar/Documents/GitHub/RemitBridge-App/site/fonts/PlusJakartaSans_500Medium.ttf);font-weight:500}
@font-face{font-family:J;src:url(file:///Users/vintibangkochar/Documents/GitHub/RemitBridge-App/site/fonts/PlusJakartaSans_700Bold.ttf);font-weight:700}
@font-face{font-family:J;src:url(file:///Users/vintibangkochar/Documents/GitHub/RemitBridge-App/site/fonts/PlusJakartaSans_800ExtraBold.ttf);font-weight:800}
@font-face{font-family:S;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:S;font-style:italic;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:M;font-weight:400;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2)}
:root{--paper:#f2eee6;--paper2:#e9e3d6;--ink:#141714;--soft:#6c6f68;--green:#14705a;--mint:#bfe3d3;--rule:#141714}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;color:var(--ink);font-family:J,sans-serif}
.abs{position:absolute}
#panel{position:absolute;left:0;top:0;width:1152px;height:1080px;background:var(--paper);overflow:hidden}
#seam{position:absolute;right:0;top:0;width:4px;height:1080px;background:var(--ink)}
.serif{font-family:S,serif;font-weight:400;letter-spacing:-.01em}
.serif em{font-style:italic;color:var(--green)}
.mono{font-family:M,J,monospace;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.mask{overflow:hidden;position:absolute}
.mask>div{will-change:transform}
.h1{font-size:104px;line-height:1.0}
.lab{font-size:21px;color:var(--soft)}
.name{font-size:34px;font-weight:700}
.logo{width:46px;height:46px;flex:none}
.hl{position:absolute;background:var(--mint);transform-origin:left center;z-index:-1}
svg.line{position:absolute;left:0;top:0;overflow:visible}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.075;mix-blend-mode:multiply}
</style></head><body>
<div id="panel"><div id="stage" class="abs" style="inset:0"></div><div id="seam"></div></div>
<div id="free" class="abs" style="inset:0"></div>
<script>
const SECTION = new URLSearchParams(location.search).get('s') || 'tech';
const SEGS = {
 intro: [
  [0.201,3.540,"Imagine trying to stretch one paycheck across three different households."],
  [3.737,6.715,"You're raising children in America while paying for your parents' life-saving"],
  [6.727,10.750,"medication in Mexico, all while supporting your spouse's family in Argentina."],
  [11.030,13.904,"For millions of immigrants, this is the unfortunate reality."],
  [14.095,17.245,"There's only one income, but three households with nine people."],
  [17.525,20.561,"Last summer, I visited my grandparents in India who sometimes"],
  [32.114,35.050,"Money sent internationally to support loved ones is known as"],
  [35.050,38.158,"a remittance, and more than nine hundred billion dollars of this money"],
  [38.173,39.801,"is sent across borders worldwide."],
  [40.209,44.688,"Yet, even transfers advertised as having zero fees can hide additional charges"],
  [44.694,46.356,"through unfavorable exchange rates."],
  [46.633,51.211,"I'm Angad Kochhar, and I built RemitBridge to bridge the gap between families and"],
  [51.212,53.353,"getting their hard-earned money back home."]],
 tech: [
  [0.315,3.341,"I designed RemitBridge's full stack architecture using React Native"],
  [3.355,7.631,"and TypeScript for iOS and Android with Supabase, PostgreSQL, and edge"],
  [7.632,9.142,"functions powering the backend."],
  [9.413,13.213,"Every six hours, Python workflows on GitHub actions collect codes through"],
  [13.253,15.108,"APIs and AI-assisted scraping."],
  [15.384,18.454,"My pipeline normalizes different fee structures and exchange rate"],
  [18.454,22.255,"markups into one metric, what the recipient back home actually receives."],
  [22.471,25.670,"Automated validation cross-checks calculations against independent"],
  [25.702,28.579,"exchange rate sources, such as Frankfurt Exchange Rates, while"],
  [28.579,30.370,"three volunteers verify screenshots."],
  [30.610,34.957,"For WhatsApp, Meta's Cloud API connects to Supabase webhooks, where my Gem"],
  [34.982,38.681,"intent classification model routes requests between Groq and Cloudflare."],
  [38.939,42.537,"Altogether, RemitBridge spans roughly thirty-eight thousand lines of code"],
  [42.659,44.599,"across TypeScript, Python, and SQL."]],
 close: [
  [0.340,4.131,"Ultimately, I can't make supporting three households easy, but I can help"],
  [4.132,7.911,"families keep more of what they earn and understand where every dollar goes, and"],
  [7.911,9.882,"that is my true goal with Remit Bridge."],
  [10.081,14.855,"You can find Remit Bridge on iOS, Android, and at remitbridgelabs.org/app."],
  [14.966,15.467,"Thank you."]]
};
const SPEED = SECTION === 'tech' ? 1.1 : 1.0;
function W(phrase, nth=0){
  let seen=0;
  for(const [a,b,txt] of SEGS[SECTION]){ let i=-1, from=0;
    while((i=txt.indexOf(phrase,from))!==-1){ if(seen++===nth) return (a+(b-a)*(i/txt.length))/SPEED; from=i+1; } }
  throw new Error('phrase not found: '+phrase);
}
// Split-screen windows: the paper panel slides in while the footage slides right.
// The same numbers drive the ffmpeg overlay (printed by window.splitExpr).
const RAMP = 0.7;
const WINDOWS = {
  intro: () => [[0.0, W('Last summer')-0.2], [W('Money sent')-0.5, W("I'm Angad")-0.1]],
  tech: () => [[0.0, 99]],
  close: () => [[-RAMP, 99]],
}[SECTION]();
const SHIFT = {intro:536, tech:236, close:416}[SECTION];
const sm = s => s*s*(3-2*s);
function split(t){ let v=0; for(const [a,b] of WINDOWS){ v=Math.max(v, Math.min(Math.min(Math.max((t-a)/RAMP,0),1), Math.min(Math.max((b-t)/RAMP,0),1))); } return sm(v); }
window.splitExpr = () => { const parts = WINDOWS.map(([a,b])=>`min(clip((t-${a.toFixed(3)})/${RAMP},0,1),clip((${b.toFixed(3)}-t)/${RAMP},0,1))`); const v = parts.length>1?`max(${parts.join(',')})`:parts[0]; return `${SHIFT}*(${v})*(${v})*(3-2*(${v}))`; };

const ink = '#141714', green = '#14705a';
function logo(k, color=ink){ const c=ICONS[k]; return `<svg class="logo" viewBox="0 0 24 24"><path fill="${color}" d="${c.path}"/></svg>`; }
const groq = `<div class="logo" style="display:flex;align-items:center;justify-content:center;font-family:J;font-weight:800;font-size:22px;color:${ink};border:3px solid ${ink};border-radius:10px">gq</div>`;
const bolt = `<svg class="logo" viewBox="0 0 24 24"><path fill="none" stroke="${ink}" stroke-width="2" stroke-linejoin="round" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>`;
const mark = (s,c=ink)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 33Q32 17 53 33"/><path d="M22 48v-6q10-9 20 0v6"/></svg>`;

const items = [];
const stage = document.getElementById('stage'), free = document.getElementById('free');
function make(parent, html){ const d=document.createElement('div'); d.innerHTML=html.trim(); const el=d.firstElementChild; parent.appendChild(el); return el; }
function scene(from, to, parent=stage){ const el=make(parent, `<div class="abs" style="inset:0"></div>`); items.push({el,kind:'scene',tin:from,tout:to}); return el; }
// A line of text that rises out of a mask.
function rise(p, x, y, html, t, cls='', w=1050){ const el=make(p, `<div class="mask" style="left:${x}px;top:${y}px;width:${w}px"><div class="${cls}">${html}</div></div>`); items.push({el:el.firstElementChild,kind:'rise',tin:t}); return el; }
function fade(p, html, t){ const el=make(p, html); items.push({el,kind:'fade',tin:t}); return el; }
function pop(p, html, t){ const el=make(p, html); items.push({el,kind:'pop',tin:t}); return el; }
function stamp(p, html, t){ const el=make(p, html); items.push({el,kind:'stamp',tin:t}); return el; }
function hl(p, x, y, w, h, t){ const el=make(p, `<div class="hl" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`); items.push({el,kind:'wipe',tin:t}); return el; }
function rule(p, x, y, w, t, color=ink, hgt=2){ const el=make(p, `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${hgt}px;background:${color};transform-origin:left center"></div>`); items.push({el,kind:'wipe',tin:t}); return el; }
// SVG path drawn on: d in panel coordinates.
function path(p, d, t, opts={}){ const {w=3, color=ink, dash='', dur=0.7, fill='none', cap='round'} = opts;
  const el=make(p, `<svg class="line" width="1920" height="1080"><path d="${d}" fill="${fill}" stroke="${color}" stroke-width="${w}" stroke-linecap="${cap}" stroke-linejoin="round" pathLength="1" ${dash?`data-dash="${dash}"`:''}/></svg>`);
  items.push({el:el.firstElementChild,kind:'draw',tin:t,dur}); return el; }
function dot(p, x, y, t, r=13, fillAt=null){ const el=make(p, `<div class="abs" style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:4px solid ${ink};background:var(--paper)"></div>`); items.push({el,kind:'pop',tin:t}); if(fillAt!=null) items.push({el,kind:'fill',tin:fillAt}); return el; }
function count(p, html, t, until, target, fmt){ const el=make(p, html); items.push({el,kind:'count',tin:t,until,target,fmt}); return el; }
function header(p, label, idx, t){ fade(p, `<div class="abs mono" style="left:72px;top:58px;font-size:20px;color:${ink}">${label}</div>`, t); if(idx) fade(p, `<div class="abs mono" style="left:880px;top:58px;font-size:20px;color:var(--soft);width:200px;text-align:right;white-space:nowrap">${idx}</div>`, t); rule(p, 72, 96, 1008, t, ink, 2); }
function house(p, x, y, t){ path(p, `M${x-46} ${y}V${y-52}L${x} ${y-92}L${x+46} ${y-52}V${y}Z M${x-14} ${y}V${y-30}H${x+14}V${y}`, t, {w:4, dur:0.8}); }
function branchHomes(p, cx, top, xs, ybot, t, labels){
  path(p, `M${cx} ${top}V${top+70}`, t, {w:4, dur:0.35});
  xs.forEach((x,i)=>{ path(p, `M${cx} ${top+70}C${cx} ${top+130} ${x} ${top+100} ${x} ${ybot-110}`, t+0.25+i*0.08, {w:4, dur:0.6}); house(p, x, ybot, t+0.55+i*0.12);
    if(labels) fade(p, `<div class="abs mono lab" style="left:${x-90}px;top:${ybot+18}px;width:180px;text-align:center">${labels[i]}</div>`, t+0.8+i*0.12); });
}
// A receipt strip with dotted leaders.
function receipt(p, x, y, w, rows, title){
  const el = make(p, `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;background:#fbf9f4;border:2px solid ${ink};padding:30px 34px 44px;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),${Array.from({length:22},(_,i)=>`${(100-(i+0.5)*100/22).toFixed(2)}% ${i%2?'calc(100% - 14px)':'100%'}`).join(',')},0 calc(100% - 14px))"></div>`);
  if (title) fade(el, `<div class="mono" style="font-size:20px;color:var(--soft);margin-bottom:18px">${title[0]}</div>`, title[1]);
  rows.forEach(([l,r,t,style=''])=>fade(el, `<div style="display:flex;align-items:baseline;gap:12px;font-family:M,J;font-size:30px;font-weight:500;margin-top:14px;${style}"><span>${l}</span><span style="flex:1;border-bottom:3px dotted ${ink};transform:translateY(-8px)"></span><span>${r}</span></div>`, t));
  return el;
}

// ---------------------------------------------------------------- intro
if (SECTION === 'intro') {
  const [A, B] = WINDOWS;
  // 1. One paycheck, three households
  let s = scene(A[0]+0.3, W("You're raising")-0.15);
  header(s, 'The reality', '', A[0]+0.4);
  rise(s, 72, 150, 'One paycheck.', W('stretch'), 'serif h1');
  rise(s, 72, 262, '<em>Three</em> households.', W('three different'), 'serif h1');
  branchHomes(s, 576, 440, [300, 576, 852], 880, W('three different')+0.1);
  fade(s, `<div class="abs mono" style="left:500px;top:398px;font-size:22px;width:152px;text-align:center;color:${green}">$ PAYCHECK</div>`, W('paycheck'));

  // 2. Map: one family, three countries
  s = scene(W("You're raising"), W("There's only")-0.15);
  header(s, 'One family', '', W("You're raising"));
  rise(s, 72, 150, 'Three <em>countries.</em>', W("You're raising")+0.1, 'serif h1');
  const M = window.MAP, mx = 640, my = 300, k = 0.86;
  const land = M.out.map(c=>`<path d="${c.d}" fill="${c.k?'#bfe3d3':'none'}" stroke="${ink}" stroke-width="${c.k?1.6:1}" stroke-opacity="${c.k?1:.45}"/>`).join('');
  fade(s, `<svg class="abs" style="left:${mx}px;top:${my}px" width="${M.W*k}" height="${M.H*k}" viewBox="0 0 ${M.W} ${M.H}">${land}</svg>`, W("You're raising")+0.2);
  const P = c => [mx+M.pts[c][0]*k, my+M.pts[c][1]*k];
  const callout = (c, y, head, sub, t) => { const [x0,y0]=P(c); dot(s, x0, y0, t, 10, t);
    path(s, `M${x0-14} ${y0}H${x0-40}L${470} ${y+30}H${440}`, t+0.1, {w:2, dur:0.5});
    rise(s, 72, y, `<div class="mono lab">${sub}</div><div class="name" style="font-size:40px">${head}</div>`, t+0.2, '', 380); };
  callout('us', 520, 'United States', 'Raising the children', W('America'));
  path(s, (()=>{const [a,b]=P('us'),[c,d]=P('mx');return `M${a} ${b}Q${a-70} ${(b+d)/2} ${c} ${d}`})(), W('paying for'), {w:3, dur:0.8});
  callout('mx', 660, 'Mexico', "Parents' medication", W('medication'));
  path(s, (()=>{const [a,b]=P('us'),[c,d]=P('ar');return `M${a} ${b}Q${a+190} ${(b+d)/2} ${c} ${d}`})(), W('all while'), {w:3, dur:1.0});
  callout('ar', 800, 'Argentina', "Spouse's family", W('Argentina'));
  rise(s, 72, 950, '<em>Life for millions of immigrants.</em>', W('For millions'), 'serif', 1000).firstElementChild.style.fontSize='54px';

  // 3. 1 / 3 / 9
  s = scene(W("There's only"), A[1]);
  header(s, 'Stretched thin', '', W("There's only"));
  [['1','Income',W('one income')],['3','Households',W('three households')],['9','People',W('nine people')]].forEach(([n,l,t],i)=>{
    const x = 72 + i*346;
    if(i) rule(s, x-24, 260, 2, t-0.2, ink, 560).style.transformOrigin='center top';
    rise(s, x, 230, `<div class="serif" style="font-size:380px;line-height:1">${n}</div>`, t, '', 300);
    fade(s, `<div class="abs mono" style="left:${x+6}px;top:690px;font-size:28px">${l}</div>`, t+0.15);
  });
  for(let i=0;i<9;i++) dot(s, 72+2*346+20+(i%3)*44, 770+Math.floor(i/3)*44, W('nine people')+0.2+i*0.04, 12, W('nine people')+0.2+i*0.04);
  for(let i=0;i<3;i++) house(s, 72+346+50+i*100, 870, W('three households')+0.2+i*0.06);
  fade(s, `<div class="abs serif" style="left:84px;top:740px;font-size:120px;color:${green}">$</div>`, W('one income')+0.2);

  // 4. Definition
  s = scene(B[0]+0.3, W('nine hundred')-0.15);
  header(s, 'The word for it', '', B[0]+0.4);
  rise(s, 72, 250, 're·mit·tance', W('internationally'), 'serif', 1050).firstElementChild.style.fontSize='170px';
  fade(s, `<div class="abs mono" style="left:80px;top:460px;font-size:26px;color:var(--soft)">/rɪˈmɪt(ə)ns/ &nbsp; noun</div>`, W('a remittance'));
  rule(s, 72, 530, 1008, W('a remittance'));
  rise(s, 72, 570, '<em style="color:var(--ink)">Money sent across borders to support family and loved ones.</em>', W('a remittance')+0.2, 'serif', 1000).firstElementChild.style.cssText='font-size:62px;line-height:1.12';

  // 5. $905B
  s = scene(W('nine hundred'), W('Yet,')-0.15);
  header(s, 'Sent across borders, 2024', '', W('nine hundred'));
  hl(s, 66, 520, 1000, 80, W('of this money'));
  count(s, `<div class="abs serif" style="left:60px;top:220px;font-size:380px;line-height:1;letter-spacing:-.03em">$0B</div>`, W('nine hundred'), W('billion')+0.3, 905, v=>'$'+v+'B');
  rise(s, 72, 640, 'in a single year, worldwide.', W('is sent'), 'serif', 1000).firstElementChild.style.fontSize='72px';
  fade(s, `<div class="abs mono" style="left:72px;top:980px;font-size:20px;color:var(--soft)">Source: World Bank, 2024 estimate</div>`, W('is sent')+0.3);

  // 6. Zero fees, and the markup they hide (an example, not a checked quote)
  s = scene(W('Yet,'), B[1]);
  header(s, 'Read the fine print', '', W('Yet,'));
  rise(s, 72, 140, '“Zero <em>fees</em>.”', W('zero fees')-0.4, 'serif h1');
  const rc = receipt(s, 72, 300, 640, [
    ['SEND', '$500.00', W('advertised')],
    ['FEE', '$0.00', W('zero fees')],
    ['REAL RATE', '₹88.00', W('hide')],
    ['YOUR RATE', '₹86.70', W('additional')],
    ['HIDDEN COST', '₹650', W('through'), `color:${green};font-weight:600`],
  ], ['Example: $500 to India', W('advertised')]);
  stamp(s, `<div class="abs mono" style="left:780px;top:330px;font-size:30px;font-weight:600;color:${green};border:4px solid ${green};padding:10px 18px;transform:rotate(-7deg)">Example</div>`, W('additional')+0.2);
  rise(s, 760, 520, '<em>About $7, hidden in the exchange rate.</em>', W('unfavorable'), 'serif', 360).firstElementChild.style.cssText='font-size:54px;line-height:1.1';

  // 7. Name title on the full-frame shot
  const n = scene(W("I'm Angad")+0.2, W('getting their')+0.8, free);
  fade(n, `<div class="abs" style="left:72px;top:860px;background:var(--paper);padding:20px 30px 22px;border-left:8px solid ${green}"><div class="name" style="font-size:40px;font-weight:800">Angad Kochar</div><div class="mono lab" style="margin-top:4px">Founder, RemitBridge Labs</div></div>`, W("I'm Angad")+0.2);
}

// ---------------------------------------------------------------- tech
if (SECTION === 'tech') {
  const t2 = W('Every six hours'), t3 = W('Automated validation'), t4 = W('For WhatsApp'), t5 = W('Altogether'), END = 45.136/SPEED;
  // 1. Spec sheet
  let s = scene(0.3, t2-0.15);
  header(s, 'How it’s built', '01 / 05', 0.35);
  rise(s, 72, 140, 'The app and', 0.5, 'serif h1');
  rise(s, 72, 245, 'its <em>backend.</em>', W('with Supabase'), 'serif h1');
  const row = (x, y, lg, name, role, t) => { fade(s, `<div class="abs" style="left:${x}px;top:${y}px;width:450px;display:flex;align-items:center;gap:18px">${lg}<div class="name" style="font-size:31px;white-space:nowrap">${name}</div><div class="mono lab" style="margin-left:auto;white-space:nowrap;font-size:18px">${role}</div></div>`, t); rule(s, x, y+66, 450, t+0.1, ink, 1.5); };
  fade(s, `<div class="abs mono" style="left:72px;top:440px;font-size:22px">The app</div>`, W('React Native')-0.3); rule(s, 72, 476, 450, W('React Native')-0.3, ink, 3);
  row(72, 500, logo('react'), 'React Native', 'UI', W('React Native'));
  row(72, 580, logo('typescript'), 'TypeScript', 'Language', W('TypeScript'));
  row(72, 660, logo('apple'), 'iOS', 'Runs on', W('iOS'));
  row(72, 740, logo('android'), 'Android', 'Runs on', W('Android'));
  fade(s, `<div class="abs mono" style="left:630px;top:440px;font-size:22px">The backend</div>`, W('with Supabase')); rule(s, 630, 476, 450, W('with Supabase'), ink, 3);
  row(630, 500, logo('supabase'), 'Supabase', 'Platform', W('Supabase'));
  row(630, 580, logo('postgresql'), 'PostgreSQL', 'Database', W('PostgreSQL'));
  row(630, 660, bolt, 'Edge Functions', 'Server code', W('edge'));
  path(s, 'M540 540C585 540 585 540 612 540', W('with')+0.1, {w:3});

  // 2. Subway line
  s = scene(t2, t3-0.15);
  header(s, 'How it’s built', '02 / 05', t2);
  rise(s, 72, 140, 'Collecting <em>prices.</em>', t2+0.1, 'serif h1');
  const Y = 640, st = [[110, W('Every six hours')], [350, W('Python')], [590, W('APIs')], [830, W('My pipeline')], [1050, W('one metric')]];
  st.forEach(([x,t],i)=>{ if(i) path(s, `M${st[i-1][0]+14} ${Y}H${x-14}`, t-0.25, {w:5, dur:0.35}); dot(s, x, Y, t, i==4?22:14, i==4?t+0.2:t+0.1); });
  const lbl = (x, up, mono, name, t, extra='', w=230) => fade(s, `<div class="abs" style="left:${x-w/2}px;top:${up?Y-190:Y+40}px;width:${w}px;text-align:center">${up?extra:''}<div class="mono lab">${mono}</div><div class="name" style="font-size:30px">${name}</div>${up?'':extra}</div>`, t);
  lbl(110, false, 'Every 6 hours', 'On a timer', st[0][1]+0.1);
  lbl(350, true, 'Runs', 'Python on GitHub Actions', st[1][1]+0.1, `<div style="display:flex;gap:14px;justify-content:center;margin-bottom:12px">${logo('python')}${logo('githubactions')}</div>`, 260);

  const Y2 = 640, r = [[130, W('Meta')], [420, W('Supabase webhooks')], [710, W('intent')]];

  const l2 = (x, lg, mono, name, t) => fade(s, `<div class="abs" style="left:${x-120}px;top:${Y2+36}px;width:240px;text-align:center"><div style="display:flex;justify-content:center;margin-bottom:10px">${lg}</div><div class="mono lab">${mono}</div><div class="name" style="font-size:28px">${name}</div></div>`, t);

// ---------------------------------------------------------------- timeline
const expo = p => p>=1?1:1-Math.pow(2,-10*p);
const clamp = v => Math.max(0,Math.min(1,v));
const panel = document.getElementById('panel');
window.render = (t, frame=0) => {
  const sp = split(t);
  panel.style.transform = `translateX(${(sp-1)*1152}px)`;
  for (const it of items) {
    const st = it.el.style, p = clamp((t-it.tin)/(it.dur||0.6)), e = expo(p), on = t>=it.tin;
    switch (it.kind) {
      case 'scene': { const a = clamp((t-it.tin)/0.25), b = clamp((t-it.tout)/0.25); st.opacity = a*(1-b); st.transform = `translateY(${(1-expo(a))*14 - expo(b)*14}px)`; break; }
      case 'rise': st.transform = `translateY(${(1-e)*110}%)`; break;
      case 'fade': st.opacity = on?e:0; st.transform = `translateY(${(1-e)*16}px)`; break;
      case 'pop': st.opacity = on?Math.min(1,e*1.4):0; st.transform = `scale(${0.85+0.15*e})`; break;
      case 'stamp': { const q=clamp((t-it.tin)/0.28); st.opacity = on?1:0; st.transform = `rotate(-8deg) scale(${1.7-0.7*expo(q)})`; break; }
      case 'wipe': st.transform = `scaleX(${on?e:0})`; break;
      case 'fill': st.background = on ? (p>0.2?green:'var(--paper)') : 'var(--paper)'; break;
      case 'draw': it.el.style.strokeDasharray = it.el.dataset.dash ? it.el.dataset.dash : '1'; if (!it.el.dataset.dash) it.el.style.strokeDashoffset = String(1-(on?expo(clamp((t-it.tin)/it.dur)):0)); break;
      case 'count': { const q = clamp((t-it.tin)/(it.until-it.tin)); it.el.textContent = it.fmt(Math.round(it.target*(1-Math.pow(1-q,3)))); break; }
    }
  }
};
window.render(0);
