<header><div class="wrap"><a class="brand" href="/"><svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 17Q24 3 46 17"/><path d="M14 30v-6q10-9 20 0v6"/></svg>RemitBridge</a><nav><a href="/support">Support</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a class="cta" href="https://www.remitbridgelabs.org/app">About the app</a></nav></div></header>

<div class="actions">
<a class="button" id="open" href="remitbridge://">Open the app</a>

<!--FOOTER-->
<script>
// Partner link (DECISIONS.md D48): /p/<partner>. Counts the visit as a first-party event
// (D31) with a random ID kept in this browser, and passes the partner on to the app.
(function () {
  var slug = (location.pathname.split('/')[2] || '').toLowerCase();
  if (!/^[a-z0-9-]{1,40}$/.test(slug)) return;
  document.getElementById('open').href = 'remitbridge://p/' + slug;
  var id;
  try {
    id = localStorage.getItem('rb_install_id');
    if (!id) { id = crypto.randomUUID(); localStorage.setItem('rb_install_id', id); }
  } catch (e) { id = crypto.randomUUID(); }
  fetch('https://gmzljjdnwndvqciqicbx.supabase.co/rest/v1/events', {
    method: 'POST',
    headers: {
      apikey: 'sb_publishable_nL6FCgvhgd7_PkvVG_yNIQ_n6tctgr5',
      'Content-Type': 'application/json',
      Prefer: 'return=minimal'
    },
    body: JSON.stringify({ install_id: id, name: 'partner_link_opened', props: { partner: slug }, platform: 'web' })
  }).catch(function () {});
})();
</script>
</body>
