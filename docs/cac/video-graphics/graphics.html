<!doctype html>
<html><head><meta charset="utf-8">
<script src="icons.js"></script>
<script src="map.js"></script>
<style>
@font-face{font-family:J;src:url(file:///Users/vintibangkochar/Documents/GitHub/RemitBridge-App/site/fonts/PlusJakartaSans_500Medium.ttf);font-weight:500}
@font-face{font-family:J;src:url(file:///Users/vintibangkochar/Documents/GitHub/RemitBridge-App/site/fonts/PlusJakartaSans_700Bold.ttf);font-weight:700}
@font-face{font-family:J;src:url(file:///Users/vintibangkochar/Documents/GitHub/RemitBridge-App/site/fonts/PlusJakartaSans_800ExtraBold.ttf);font-weight:800}
:root{--green:#14705a;--deep:#0b4f3f;--bg:#0c3a30;--mint:#8fcab6;--tint:#e8f2ee;--ink:#1c2024;--sub:#5b6470}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:J,sans-serif;color:#fff}
.abs{position:absolute}
.hole{position:absolute;border-radius:28px;box-shadow:0 0 0 3000px var(--bg)}
.ring{position:absolute;border-radius:30px;border:4px solid rgba(143,202,182,.55)}
.tag{position:absolute;background:#fff;color:var(--ink);font-weight:700;font-size:26px;padding:10px 20px;border-radius:14px;box-shadow:0 5px 0 var(--deep)}
.title{font-size:64px;font-weight:800;line-height:1.08}
.mask{overflow:hidden;display:inline-block;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.mask>span{display:inline-block}
.chip{display:flex;align-items:center;gap:18px;background:#fff;color:var(--ink);border-radius:20px;padding:0 22px;height:84px;font-size:32px;font-weight:700;box-shadow:0 6px 0 var(--deep);white-space:nowrap}
.chip .ic{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center}
.chip .ic svg{width:52px;height:52px;display:block}
.chip small{display:block;font-size:20px;font-weight:500;color:var(--sub);margin-top:2px}
.card{position:absolute;border-radius:28px;background:rgba(255,255,255,.07);border:2px solid rgba(143,202,182,.35)}
.cardLabel{position:absolute;font-size:24px;font-weight:700;color:var(--mint)}
.node{position:absolute;background:#fff;color:var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;font-size:28px;font-weight:700;line-height:1.2}
.node .ics{display:flex;gap:16px;height:64px;align-items:center}
.node .ics svg{width:60px;height:60px;display:block}
.node small{font-size:21px;font-weight:500;color:var(--sub)}
.pill{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:14px 26px;font-size:28px;font-weight:700;white-space:nowrap}
svg.ov{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.clip{position:absolute;left:0;top:0;width:1170px;height:1080px;overflow:hidden}
.panel{position:absolute;left:70px;top:150px;width:700px;height:780px;border-radius:32px;background:#fff;color:var(--ink);box-shadow:0 10px 0 rgba(11,79,63,.6);overflow:hidden}
</style></head><body>
<div id="root"></div>
<script>
const SECTION = new URLSearchParams(location.search).get('s') || 'tech';
const SEGS = {
 intro: [
  [0.201,3.540,"Imagine trying to stretch one paycheck across three different households."],
  [3.737,6.715,"You're raising children in America while paying for your parents' life-saving"],
  [6.727,10.750,"medication in Mexico, all while supporting your spouse's family in Argentina."],
  [11.030,13.904,"For millions of immigrants, this is the unfortunate reality."],
  [14.095,17.245,"There's only one income, but three households with nine people."],
  [17.525,20.561,"Last summer, I visited my grandparents in India who sometimes"],
  [20.566,21.873,"receive money from my family."],
  [22.109,22.826,"We're fortunate."],
  [22.836,25.566,"For them, that money provides comfort, maybe a nice vacation."],
  [25.817,28.552,"But for other families, those same transfers could determine"],
  [32.114,35.050,"Money sent internationally to support loved ones is known as"],
  [35.050,38.158,"a remittance, and more than nine hundred billion dollars of this money"],
  [38.173,39.801,"is sent across borders worldwide."],
  [40.209,44.688,"Yet, even transfers advertised as having zero fees can hide additional charges"],
  [44.694,46.356,"through unfavorable exchange rates."],
  [46.633,51.211,"I'm Angad Kochhar, and I built RemitBridge to bridge the gap between families and"],
  [51.212,53.353,"getting their hard-earned money back home."]],
 tech: [
  [0.315,3.341,"I designed RemitBridge's full stack architecture using React Native"],
  [3.355,7.631,"and TypeScript for iOS and Android with Supabase, PostgreSQL, and edge"],
  [7.632,9.142,"functions powering the backend."],
  [9.413,13.213,"Every six hours, Python workflows on GitHub actions collect codes through"],
  [13.253,15.108,"APIs and AI-assisted scraping."],
  [15.384,18.454,"My pipeline normalizes different fee structures and exchange rate"],
  [18.454,22.255,"markups into one metric, what the recipient back home actually receives."],
  [22.471,25.670,"Automated validation cross-checks calculations against independent"],
  [25.702,28.579,"exchange rate sources, such as Frankfurt Exchange Rates, while"],
  [28.579,30.370,"three volunteers verify screenshots."],
  [30.610,34.957,"For WhatsApp, Meta's Cloud API connects to Supabase webhooks, where my Gem"],
  [34.982,38.681,"intent classification model routes requests between Groq and Cloudflare."],
  [38.939,42.537,"Altogether, RemitBridge spans roughly thirty-eight thousand lines of code"],
  [42.659,44.599,"across TypeScript, Python, and SQL."]],
 demo: [],
 close: [
  [0.340,4.131,"Ultimately, I can't make supporting three households easy, but I can help"],
  [4.132,7.911,"families keep more of what they earn and understand where every dollar goes, and"],
  [7.911,9.882,"that is my true goal with Remit Bridge."],
  [10.081,14.855,"You can find Remit Bridge on iOS, Android, and at remitbridgelabs.org/app."],
  [14.966,15.467,"Thank you."]]
};
const SPEED = (SECTION === 'tech' || SECTION === 'demo') ? 1.1 : 1.0;
function W(phrase, nth=0){ let seen=0;
  for(const [a,b,txt] of SEGS[SECTION]){ let i=-1, from=0;
    while((i=txt.indexOf(phrase,from))!==-1){ if(seen++===nth) return (a+(b-a)*(i/txt.length))/SPEED; from=i+1; } }
  throw new Error('phrase not found: '+phrase); }

function icon(k){ const c=ICONS[k]; return `<svg viewBox="0 0 24 24"><path fill="#${c.hex}" d="${c.path}"/></svg>`; }
const groq = `<svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#F55036"/><path d="M12 6.2a4.6 4.6 0 1 0 0 9.2h1.9v-2.6H12a2 2 0 1 1 2-2v5.3a2 2 0 0 1-3.4 1.4l-1.8 1.8A4.6 4.6 0 0 0 16.6 16V10.8A4.6 4.6 0 0 0 12 6.2z" fill="#fff"/></svg>`;
const bolt = `<svg viewBox="0 0 24 24"><path fill="#3FCF8E" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>`;
const clock = `<svg viewBox="0 0 24 24" fill="none" stroke="#14705a" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.8 2.3"/></svg>`;
const globe = `<svg viewBox="0 0 24 24" fill="none" stroke="#14705a" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19"/></svg>`;
const sort = `<svg viewBox="0 0 24 24" fill="none" stroke="#14705a" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h6"/></svg>`;
const doc = `<svg viewBox="0 0 24 24" fill="none" stroke="#14705a" stroke-width="2.2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`;
const mark = (s,c='#fff')=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 33Q32 17 53 33"/><path d="M22 48v-6q10-9 20 0v6"/></svg>`;
const houseSvg = (w=110, fill='#e8f2ee', stroke='#14705a') => `<svg width="${w}" height="${w*40/44}" viewBox="0 0 44 40" style="display:block"><path d="M4 19 22 4l18 15v19H4z" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/><rect x="17" y="25" width="10" height="13" fill="${stroke}"/></svg>`;
const person = `<svg width="46" height="60" viewBox="0 0 46 60" style="display:block"><circle cx="23" cy="14" r="11" fill="#fff"/><path d="M3 58c0-14 9-24 20-24s20 10 20 24z" fill="#fff"/></svg>`;
const chip = (ic, label, w, sub='') => `<div class="chip" style="width:${w}px"><div class="ic">${ic}</div><div>${label}${sub?`<small>${sub}</small>`:''}</div></div>`;

// ---- building blocks. Every element is {el, kind, tin, dur}; scenes add transitions.
const items = []; let CUR = null;
const root = document.getElementById('root');
function mk(parent, html){ const d=document.createElement('div'); d.innerHTML=html.trim(); const el=d.firstElementChild; parent.appendChild(el); return el; }
function scene(parent, from, to, tin='fade', tout='fade', opts={}){ const el = mk(parent, `<div class="abs" style="inset:0"></div>`);
  const sc = {el, kind:'scene', tin:from, tout:to, in:tin, out:tout, dur:opts.dur||0.65, ox:opts.ox||600, oy:opts.oy||540}; items.push(sc); CUR=sc; return el; }
// An element appears no sooner than 0.3s into its scene, so nothing pops in mid-transition.
function at(t){ if (!CUR) return t; const lead = (CUR.in==='fade'||CUR.in==='zoom'||CUR.in==='slideIn') ? 0.3 : 0; return Math.max(t, CUR.tin + lead); }
function add(p, html, t, kind='pop', dur){ const el = mk(p, html); items.push({el, kind, tin:at(t), dur:dur||({pop:.55,fade:.6,slide:.6,drop:.75,spin:.7,stamp:.4,draw:.6,drawv:.5,grow:.9}[kind]||.6)}); return el; }
// Centered on cx, so rows line up whatever their content.
function C(p, cx, y, html, t, kind='pop'){ const el = add(p, `<div class="abs" style="left:${cx}px;top:${y}px;width:0"><div style="position:absolute;left:0;top:0;transform:translateX(-50%)">${html}</div></div>`, t, kind); return el; }
// Title: each word rises out of its own mask, staggered.
function title(p, x, y, lines, t, size=64){ const wrap = mk(p, `<div class="abs title" style="left:${x}px;top:${y}px;font-size:${size}px"></div>`);
  let k=0; lines.forEach((ln,li)=>{ const line = mk(wrap, `<div></div>`); ln.split(' ').forEach(w=>{ const m = mk(line, `<span class="mask"><span>${w}&nbsp;</span></span>`); items.push({el:m.firstElementChild, kind:'rise', tin:at(t)+k*0.07, dur:.6}); k++; }); }); return wrap; }
// SVG stroke drawn on.
function line(p, d, t, {w=6, color='#8fcab6', dur=0.7, head=false}={}){ const el = mk(p, `<svg class="ov" width="1920" height="1080"><defs><marker id="h${items.length}" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><path d="M0 0L4 2L0 4z" fill="${color}"/></marker></defs><path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" ${head?`marker-end="url(#h${items.length})"`:''}/></svg>`);
  items.push({el:el.querySelector('path'), kind:'dash', tin:at(t), dur, svg:el, head, mid:`url(#h${items.length})`}); return el; }
function type(p, html, text, t, cps=22){ const el = add(p, html, t, 'fade', .2); const target = el.querySelector('[data-type]') || el; items.push({el:target, kind:'type', tin:at(t), text, cps}); return el; }
function count(p, html, t, until, target, fmt){ const el = add(p, html, t, 'fade', .3); items.push({el, kind:'count', tin:at(t), until:Math.max(until, at(t)+1.0), target, fmt}); return el; }
function pulse(el, t){ items.push({el, kind:'pulse', tin:t, dur:.5}); }

// Boxed layout: Angad on the right, graphics on the left.
function box(from, to){ const s = mk(root, `<div class="abs" style="inset:0"></div>`); items.push({el:s, kind:'scene', tin:from, tout:to, in:'fade', out:'fade', dur:.034});
  mk(s, `<div class="hole" style="left:1220px;top:150px;width:620px;height:780px"></div>`); mk(s, `<div class="ring" style="left:1216px;top:146px;width:628px;height:788px"></div>`);
  const tg = mk(s, `<div class="tag" style="left:1250px;top:858px">Angad Kochar</div>`); return mk(s, `<div class="clip"></div>`); }

// ================================================================ intro
if (SECTION === 'intro') {
  const A0 = 0.15, A1 = W('Last summer')-0.1, B0 = W('Money sent')-0.15, B1 = W("I'm Angad")+0.3;
  const T1 = 4.4, T2 = W("There's only"), T4 = W('nine hundred')-0.2, T5 = W('Yet,');
  let stage = box(A0, A1);
  // 1. One paycheck, three households
  let s = scene(stage, A0, T1, 'zoom', 'pushLeft');
  title(s, 90, 110, ['One paycheck.', 'Three households.'], A0+0.1);
  C(s, 600, 370, `<div style="background:#fff;color:#14705a;border-radius:20px;padding:20px 34px;font-size:40px;font-weight:800;box-shadow:0 8px 0 #0b4f3f;white-space:nowrap">One paycheck</div>`, W('paycheck')-0.3, 'drop');
  const hx = [270, 600, 930];
  hx.forEach((x,i)=>{ line(s, `M600 470V520Q600 570 ${x} 590V650`, W('three different')-0.2+i*0.12, {w:7, dur:.6});
    C(s, x, 670, `<div style="display:flex;flex-direction:column;align-items:center;gap:12px">${houseSvg(120)}<div style="font-size:28px;font-weight:700;white-space:nowrap">Home ${i+1}</div></div>`, W('three different')+0.25+i*0.15, 'drop'); });

  // 2. Map
  s = scene(stage, T1, T2, 'pushLeft', 'wipe');
  title(s, 90, 110, ['One family,', 'three countries'], T1);
  const M = window.MAP, ox = 560, oy = 280;
  const land = M.out.map(c=>`<path d="${c.d}" fill="${c.k?'#14705a':'rgba(255,255,255,.10)'}" stroke="${c.k?'#8fcab6':'rgba(143,202,182,.35)'}" stroke-width="${c.k?2:1}"/>`).join('');
  add(s, `<svg class="abs" style="left:${ox}px;top:${oy}px" width="${M.W}" height="${M.H}" viewBox="0 0 ${M.W} ${M.H}">${land}</svg>`, T1+0.2, 'fade');
  const P = k => [ox+M.pts[k][0], oy+M.pts[k][1]];
  const dot = (k, t) => { const [x,y]=P(k); add(s, `<div class="abs" style="left:${x-15}px;top:${y-15}px;width:30px;height:30px;border-radius:50%;background:#fff;border:7px solid #46a085"></div>`, t, 'pop'); };
  const label = (y, head, sub, t, k) => { add(s, `<div class="abs" style="left:90px;top:${y}px;width:330px;background:#fff;color:#1c2024;border-radius:18px;padding:14px 22px;box-shadow:0 6px 0 #0b4f3f"><div style="font-size:30px;font-weight:800">${head}</div><div style="font-size:22px;font-weight:500;color:#5b6470">${sub}</div></div>`, t, 'slide');
    const [x,yy]=P(k); line(s, `M420 ${y+46}H${x-60}L${x-22} ${yy}`, t+0.25, {w:3, color:'rgba(255,255,255,.55)', dur:.5}); };
  dot('us', W('America')); label(330, 'United States', 'raising the children', W('America'), 'us');
  const arc = (a, b, bend, t) => { const [x1,y1]=P(a),[x2,y2]=P(b); line(s, `M${x1} ${y1}Q${(x1+x2)/2+bend} ${(y1+y2)/2} ${x2} ${y2}`, t, {w:5, color:'#fff', dur:1.1}); };
  arc('us','mx',-90, W('paying for')); dot('mx', W('medication')); label(500, 'Mexico', "parents' medication", W('medication'), 'mx');
  arc('us','ar',190, W('all while')); dot('ar', W('Argentina')); label(670, 'Argentina', "spouse's family", W('Argentina'), 'ar');
  add(s, `<div class="abs" style="left:90px;top:880px;font-size:36px;font-weight:700;color:#8fcab6">This is life for millions of immigrants.</div>`, W('For millions'), 'fade');

  // 3. 1 / 3 / 9
  s = scene(stage, T2, A1+1, 'wipe', 'fade');
  title(s, 90, 110, ['Stretched thin'], T2);
  const cols = [[255, '1', 'income', W('one income')], [615, '3', 'households', W('three households')], [975, '9', 'people', W('nine people')]];
  cols.forEach(([cx,n,l,t])=>{ C(s, cx, 290, `<div style="text-align:center"><div style="font-size:220px;font-weight:800;line-height:1">${n}</div><div style="font-size:38px;font-weight:700;color:#8fcab6;margin-top:4px">${l}</div></div>`, t, 'spin'); });
  C(s, 255, 640, `<div style="width:120px;height:80px;border-radius:14px;background:#fff;color:#14705a;font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0b4f3f">$</div>`, W('one income')+0.25, 'drop');
  [-100,0,100].forEach((dx,i)=>C(s, 615+dx, 640, houseSvg(86, '#e8f2ee', '#8fcab6'), W('three households')+0.25+i*0.12, 'drop'));
  for(let i=0;i<9;i++) C(s, 975+((i%3)-1)*66, 620+Math.floor(i/3)*76, person, W('nine people')+0.05+i*0.03, 'pop');

  // 3b. The grandparents: Angad's own photos, dropped in like prints
  const C0 = A1, C1 = W('But for other')-0.1;
  stage = box(C0, C1);
  s = scene(stage, C0, C1, 'fade', 'fade');
  title(s, 90, 110, ['Visiting my grandparents'], C0+0.05, 56);
  const prints = [['pics/p3_m.jpg', 70, 230, 600, -5, W('visited')], ['pics/p1_m.jpg', 470, 300, 640, 4, W('receive money')], ['pics/p2_m.jpg', 200, 520, 600, -2, W('For them')]];
  prints.forEach(([src,x,y,w,rot,t])=>add(s, `<div class="abs" style="left:${x}px;top:${y}px"><div style="transform:rotate(${rot}deg);background:#fff;padding:14px 14px 46px;border-radius:6px;box-shadow:0 12px 0 #072920,0 18px 40px rgba(0,0,0,.35)"><img src="${src}" style="display:block;width:${w}px;border-radius:2px"></div></div>`, t, 'drop'));
  add(s, `<div class="abs" style="left:92px;top:178px;font-size:26px;font-weight:700;color:#8fcab6">India, last summer</div>`, W('in India'), 'fade');

  stage = box(B0, B1);
  // 4. What a remittance is
  s = scene(stage, B0, T4, 'zoom', 'pushUp');
  add(s, `<div class="abs" style="left:90px;top:250px;width:1060px;background:#fff;color:#1c2024;border-radius:32px;padding:56px 60px;box-shadow:0 10px 0 #0b4f3f;min-height:440px"><div style="height:120px"></div><div style="font-size:30px;font-weight:500;color:#5b6470;margin-top:4px">noun</div></div>`, B0+0.1, 'drop');
  type(s, `<div class="abs" style="left:150px;top:306px;width:900px;font-size:100px;font-weight:800;color:#14705a"><span data-type></span></div>`, 'remittance', B0+0.25, 20);
  add(s, `<div class="abs" style="left:150px;top:520px;width:940px;font-size:46px;font-weight:700;line-height:1.25;color:#1c2024">Money sent across borders to support family and loved ones.</div>`, B0+0.15, 'fade');

  // 5. $905B
  s = scene(stage, T4, T5, 'pushUp', 'iris', {ox:290, oy:510});
  title(s, 90, 110, ['Sent across borders'], T4, 52);
  count(s, `<div class="abs" style="left:80px;top:230px;font-size:270px;font-weight:800;line-height:1;letter-spacing:-.03em">$0B</div>`, W('nine hundred'), W('billion')+0.4, 905, v=>'$'+v+'B');
  add(s, `<div class="abs" style="left:96px;top:540px;font-size:54px;font-weight:800">in a single year, worldwide</div>`, W('of this money'), 'slide');
  add(s, `<div class="abs" style="left:96px;top:630px;font-size:30px;font-weight:500;color:#8fcab6">2024 estimate. Source: World Bank</div>`, W('of this money')+0.4, 'fade');

  // 6. Zero fees (example numbers, labelled as one)
  s = scene(stage, T5, B1, 'iris', 'fade', {ox:290, oy:510});
  title(s, 90, 110, ['"Zero fees"?'], T5);
  add(s, `<div class="abs" style="left:110px;top:330px;width:360px;height:360px;border-radius:50%;background:#fff;color:#14705a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 0 #0b4f3f"><div style="font-size:120px;font-weight:800;line-height:1">$0</div><div style="font-size:44px;font-weight:800;letter-spacing:.08em">FEE</div></div>`, W('zero fees')-0.2, 'stamp');
  const rc = add(s, `<div class="abs" style="left:530px;top:300px;width:620px;background:#fff;color:#1c2024;border-radius:28px;padding:34px 38px;box-shadow:0 8px 0 #0b4f3f"><div style="font-size:22px;font-weight:700;color:#5b6470">Example: $500 to India</div>
    <div style="display:flex;justify-content:space-between;font-size:32px;font-weight:700;margin-top:22px"><span>Real rate</span><span>₹88.00 per $1</span></div>
    <div style="display:flex;justify-content:space-between;font-size:32px;font-weight:700;margin-top:14px"><span>Rate you get</span><span>₹86.70 per $1</span></div>
    <div style="height:2px;background:#e4e7eb;margin:24px 0"></div>
    <div style="font-size:24px;font-weight:700;color:#0e5c49">Hidden in the rate</div>
    <div class="hid" style="font-size:64px;font-weight:800;color:#0e5c49;margin-top:4px;display:inline-block;border-radius:12px;padding:0 10px;margin-left:-10px">₹650 <span style="font-size:34px;color:#5b6470">(about $7)</span></div></div>`, W('hide additional')-0.2, 'slide');
  pulse(rc.querySelector('.hid'), W('unfavorable'));
  add(s, `<div class="abs" style="left:90px;top:800px;font-size:36px;font-weight:700;color:#8fcab6">The cost moves into the exchange rate.</div>`, W('hide additional')+0.8, 'fade');

const clamp = v => Math.max(0, Math.min(1, v));
const out3 = p => 1-Math.pow(1-p,3);
const back = p => { const c=1.6; return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2); };
const bounce = p => { const n=7.5625,d=2.75; if(p<1/d) return n*p*p; if(p<2/d) return n*(p-=1.5/d)*p+.75; if(p<2.5/d) return n*(p-=2.25/d)*p+.9375; return n*(p-=2.625/d)*p+.984375; };
function sceneStyle(it, t){
  const st = it.el.style; const d = it.dur;
  const pi = clamp((t-it.tin)/d), po = clamp((t-it.tout)/d), ei = out3(pi), eo = out3(po);
  let tr = '', op = 1, clip = 'none';
  if (t < it.tin) { st.opacity = 0; return; }
  switch (it.in) {
    case 'fade': op *= ei; break;
    case 'zoom': op *= ei; tr += ` scale(${1.08-0.08*ei})`; break;
    case 'pushLeft': tr += ` translateX(${(1-ei)*1200}px)`; break;
    case 'pushUp': tr += ` translateY(${(1-ei)*1080}px)`; break;
    case 'wipe': clip = `inset(0 ${(1-ei)*100}% 0 0)`; break;
    case 'iris': clip = `circle(${ei*160}% at ${it.ox}px ${it.oy}px)`; break;
    case 'slideIn': tr += ` translateX(${(1-ei)*-820}px)`; break;
  }
  if (t > it.tout) switch (it.out) {
    case 'fade': op *= 1-eo; break;
    case 'zoom': op *= 1-eo; tr += ` scale(${1+0.12*eo})`; break;
    case 'pushLeft': tr += ` translateX(${-eo*1200}px)`; break;
    case 'pushUp': tr += ` translateY(${-eo*1080}px)`; break;
    case 'wipe': clip = `inset(0 0 0 ${eo*100}%)`; break;
    case 'iris': op *= 1-eo; break;
  }
  st.opacity = op; st.transform = tr || 'none'; st.clipPath = clip; st.transformOrigin = '600px 540px';
}
window.render = (t) => {
  for (const it of items) {
    const st = it.el.style, p = clamp((t-it.tin)/(it.dur||.6)), on = t >= it.tin;
    switch (it.kind) {
      case 'scene': sceneStyle(it, t); break;
      case 'pop': st.opacity = on?clamp(p*2):0; st.transform = `scale(${on?0.5+0.5*back(p):0.5})`; break;
      case 'fade': st.opacity = on?out3(p):0; st.transform = `translateY(${(1-out3(p))*20}px)`; break;
      case 'slide': st.opacity = on?clamp(p*2.5):0; st.transform = `translateX(${(1-back(p))*-60}px)`; break;
      case 'drop': st.opacity = on?clamp(p*4):0; st.transform = `translateY(${(1-bounce(p))*-70}px)`; break;
      case 'spin': st.opacity = on?clamp(p*2):0; st.transform = `rotate(${(1-out3(p))*-25}deg) scale(${0.6+0.4*back(p)})`; break;
      case 'stamp': st.opacity = on?clamp(p*3):0; st.transform = `scale(${on?1.5-0.5*out3(p):1.5})`; break;
