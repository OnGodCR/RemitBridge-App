name: Manual prices

# Checks prices entered in the app's "Add a price" form (DECISIONS.md D54): each pending
# row in manual_observations goes through the same gate as any other quote, and its
# outcome is written back to the row.
#
# The app's process-prices Edge Function starts this right after an entry, when
# GITHUB_DISPATCH_TOKEN is set in Supabase. The schedule is the fallback. It's every three
# hours because an entry must be checked within six (MANUAL_QUOTE_MAX_AGE_S), and each run
# costs private-repo Actions minutes. A run with nothing pending stops after one request.

on:
  workflow_dispatch:
    inputs:
      reviewed_collection:
        description: Process reviewed collection files even when the app queue is empty
        type: boolean
        default: false
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: read

concurrency:
  group: manual-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Anything waiting?
        id: pending
        env:
          REVIEWED_COLLECTION: ${{ inputs.reviewed_collection }}
        run: |
          # A newer sb_secret_ key goes only in the apikey header; a legacy key is also a bearer token (D137).
          AUTH=(); [[ "$SUPABASE_SERVICE_ROLE_KEY" == sb_* ]] || AUTH=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          n=$(curl -fsS "$SUPABASE_URL/rest/v1/manual_observations?select=id&status=eq.pending" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            "${AUTH[@]}" | jq length)
          echo "Pending entries: $n"
          if [ "$REVIEWED_COLLECTION" = true ]; then n=$((n + 1)); fi
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pending.outputs.n != '0'
      - uses: astral-sh/setup-uv@v6
        if: steps.pending.outputs.n != '0'
      - if: steps.pending.outputs.n != '0'
        working-directory: engine
        run: uv sync --locked --no-dev
      - if: steps.pending.outputs.n != '0'
        working-directory: engine
        run: uv run rb-engine run --adapter manual --store supabase
